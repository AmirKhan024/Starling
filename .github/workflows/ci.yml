name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (starling_crdt, starling_consensus)
        run: mypy packages/starling_crdt packages/starling_consensus

      - name: Test (excludes integration tests needing model weights/datasets)
        run: pytest -q -m "not integration"
