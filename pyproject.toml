[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "starling"
version = "0.1.0"
description = "Starling — decentralized multi-camera identity network"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "ultralytics>=8.0.200",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "streamlit>=1.32.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
    "pydantic>=2",
    "pyyaml",
    "structlog",
    "python-ulid>=1.1.0",
    "protobuf>=5.26.1,<6",
    "pyzmq>=25",
    "pynacl>=1.5.0",
    "scipy>=1.10.0",
    "shapely>=2.0.0",
    "trackeval>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "hypothesis", "ruff", "mypy", "grpcio-tools>=1.71.0,<2"]
# Optional: only imported (lazily) by starling_eval.runner if WANDB_API_KEY
# is set — a run must never fail because this isn't installed.
wandb = ["wandb"]

[tool.setuptools.packages.find]
where = ["packages"]

[tool.setuptools.package-dir]
"" = "packages"

[tool.ruff]
line-length = 100
# apps/ is legacy V1 code (frozen baseline.py + dashboard) preserved verbatim
# per CLAUDE.md ("do not improve them") — exempt from style modernization.
# starling_proto/generated/ is protoc output — regenerated by `make proto`,
# never hand-edited.
extend-exclude = ["apps", "packages/starling_proto/generated"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires model weights or a dataset; skip cleanly when absent",
]
