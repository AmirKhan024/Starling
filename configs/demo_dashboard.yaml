# Config for the simulator demo dashboard (apps/demo_dashboard). Every
# field has a documented default in apps/demo_dashboard/config.py.
peers:
  0: "127.0.0.1:5555"
  1: "127.0.0.1:5556"
  2: "127.0.0.1:5557"
  3: "127.0.0.1:5558"

keys_dir: "configs/keys"
navmesh_path: "data/floorplan/warehouse_demo.geojson"
geometry:
  cell_size_m: 0.25

sim_endpoint: "tcp://127.0.0.1:5560"
token_dir: "data/demo/tokens"
http_host: "127.0.0.1"
http_port: 8765

match:
  gate_extra_slack_m: 0.5   # absorb origin noise + grid quantisation at the sim's 0.2 s claim spacing
  # Must match the sim nodes' own calibrated value (configs/nodes/sim/node-0*.yaml):
  # the dashboard runs its OWN resolver over what it overhears, so if it keeps the
  # 0.60 default while the nodes use 0.32, it silently resolves almost nothing
  # under the `realistic` profile. See scripts/calibrate_match_threshold.py.
  sim_threshold: 0.32
  threshold_source: "ROC-CALIBRATED (scripts/calibrate_match_threshold.py, realistic profile, 2026-09-23)"


stale_after_s: 4.0
control_port_offset: 1000
