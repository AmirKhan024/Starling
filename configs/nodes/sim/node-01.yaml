# Starling node config — node-01 (SIM variant). See node-00.yaml for the
# field-by-field commentary; this file only calls out what differs.

node_id: 1
name: "node-01"
source: "sim"
is_chokepoint: false
db_path: "data/nodes/sim/node-01/local.db"
calib_path: null

sim:
  connect_endpoint: "tcp://127.0.0.1:5560"

stream_epoch: 0.0

perception:
  embed_dim: 64

match:
  sim_threshold: 0.60
  margin_threshold: 0.10
  lost_threshold_s: 120.0
  ema_alpha: 0.10

net:
  listen_port: 5556
  neighbours: ["127.0.0.1:5555", "127.0.0.1:5557"]  # ring topology (CLAUDE.md rule 4)
  gossip_interval_s: 2.0

geometry:
  navmesh_path: "data/floorplan/warehouse_demo.geojson"
  cell_size_m: 0.25

coverage:
  # Node 1 sits on the EAST side of the blind aisle (boundary_id 2,
  # "blind_aisle_east_exit") — the aisle's other exit, and also the node
  # the default scenario's scripted occlusion events target.
  watched_boundary_ids: [2]
  tau_attest: 0.7

attest:
  tick_interval_s: 2.0
  tau_attest: 0.7

attack:
  attack: "none"
  intensity: 0.0
  enable_control_endpoint: true
  control_bind_host: "127.0.0.1"
