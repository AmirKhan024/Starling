# Starling node config — node-02 (WORLD variant: its camera is the live 3D
# world's "South-west · Packing" camera). GENERATED by scripts/build_world_floorplan.py
# from configs/world/warehouse.yaml — edit that file and rebuild, not this one.
# Every threshold has a documented default in packages/starling_node/config.py.

node_id: 2
name: "node-02"

# The literal string "world": apps/node.py receives this camera's JPEG frames
# from the world server and runs real perception on them (_run_world).
source: "world"
is_chokepoint: false

db_path: "data/nodes/world/node-02/local.db"
calib_path: "configs/calib/world/node-02.yaml"   # floor homography for this camera

stream_epoch: 0.0

perception:
  yolo_model: "yolo11s.pt"   # see docs/results_world_perception.md for why not the nano model
  conf: 0.15                 # low: ByteTrack keeps a track alive on weak detections; new tracks still need 0.25
  embed_dim: 96              # starling_perception.appearance: 6 stripes x (12 hue + 4 value) bins

world:
  connect_endpoint: "tcp://127.0.0.1:5570"
  fps: 3.0
  imgsz: 512
  torch_threads: 3
  registry_path: "data/world/employee_registry.json"   # every camera recognises enrolled employees
  gate: null

match:
  # ROC-CALIBRATED on held-out renders of the live world (cross-camera pairs,
  # score = similarity x quality): docs/results_world_perception.md.
  sim_threshold: 0.7
  threshold_source: "ROC-CALIBRATED (scripts/calibrate_world_appearance.py, live 3D world)"
  margin_threshold: 0.10
  gate_extra_slack_m: 0.6   # foot-point noise (median 0.19 m, p90 0.33 m) at 3 claims/s
  # A verified/recognised employee's anchor absorbs the unnamed hypothesis the
  # same person had before it (starling_crdt.resolver._adopt_unanchored).
  anchor_adopt_radius_m: 2.0
  anchor_adopt_max_age_s: 10.0
  # Two cameras naming one person at the same instant differ by their combined
  # position error: not a conflict (starling_crdt.resolver).
  anchor_continue_slack_m: 3.5
  lost_threshold_s: 120.0
  ema_alpha: 0.10

net:
  listen_port: 5557
  neighbours: ["127.0.0.1:5558", "127.0.0.1:5555"]  # ring topology (CLAUDE.md rule 4)
  gossip_interval_s: 2.0

geometry:
  navmesh_path: "data/floorplan/warehouse_world.geojson"
  cell_size_m: 0.25

coverage:
  # This camera's own zone (largest piece), as computed from what it can see.
  roi_polygon: [[0.013, 14.238], [0.263, 14.238], [0.263, 14.488], [0.512, 14.488], [0.512, 14.738], [0.762, 14.738], [0.762, 14.988], [1.512, 14.988], [1.512, 15.238], [2.263, 15.238], [2.263, 15.488], [2.763, 15.488], [2.763, 15.738], [3.013, 15.738], [3.013, 15.988], [3.513, 15.988], [3.513, 16.238], [3.763, 16.238], [3.763, 16.488], [4.013, 16.488], [4.013, 16.988], [4.263, 16.988], [4.263, 17.238], [4.513, 17.238], [4.513, 17.738], [4.763, 17.738], [4.763, 18.488], [5.013, 18.488], [5.013, 18.738], [9.012, 18.738], [9.012, 19.512], [5.513, 19.512], [5.513, 19.738], [5.763, 19.738], [5.763, 19.988], [14.988, 19.988], [14.988, 19.512], [14.488, 19.512], [14.488, 19.262], [14.012, 19.262], [14.012, 19.512], [11.488, 19.512], [11.488, 18.238], [11.988, 18.238], [11.988, 17.988], [13.988, 17.988], [13.988, 17.738], [14.988, 17.738], [14.988, 14.012], [9.488, 14.012], [9.488, 12.988], [9.738, 12.988], [9.738, 12.738], [9.988, 12.738], [9.988, 12.488], [10.238, 12.488], [10.238, 12.238], [10.738, 12.238], [10.738, 11.988], [10.988, 11.988], [10.988, 11.738], [11.238, 11.738], [11.238, 11.488], [11.738, 11.488], [11.738, 11.238], [11.988, 11.238], [11.988, 10.988], [12.238, 10.988], [12.238, 10.738], [12.738, 10.738], [12.738, 10.512], [9.488, 10.512], [9.488, 10.012], [0.013, 10.012]]
  watched_boundary_ids: []
  tau_attest: 0.7
  background_alpha: 0.02
  bg_diff_threshold: 30.0
  blob_area_threshold: 120   # pixels in the quarter-resolution coverage frame

attest:
  tick_interval_s: 2.0
  tau_attest: 0.7

plausibility:
