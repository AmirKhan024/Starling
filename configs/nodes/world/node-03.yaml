# Starling node config — node-03 (WORLD variant: its camera is the live 3D
# world's "South-east · Outbound" camera). GENERATED by scripts/build_world_floorplan.py
# from configs/world/warehouse.yaml — edit that file and rebuild, not this one.
# Every threshold has a documented default in packages/starling_node/config.py.

node_id: 3
name: "node-03"

# The literal string "world": apps/node.py receives this camera's JPEG frames
# from the world server and runs real perception on them (_run_world).
source: "world"
is_chokepoint: false

db_path: "data/nodes/world/node-03/local.db"
calib_path: "configs/calib/world/node-03.yaml"   # floor homography for this camera

stream_epoch: 0.0

perception:
  yolo_model: "yolo11s.pt"   # see docs/results_world_perception.md for why not the nano model
  conf: 0.15                 # low: ByteTrack keeps a track alive on weak detections; new tracks still need 0.25
  embed_dim: 96              # starling_perception.appearance: 6 stripes x (12 hue + 4 value) bins

world:
  connect_endpoint: "tcp://127.0.0.1:5570"
  fps: 3.0
  imgsz: 512
  torch_threads: 3
  registry_path: "data/world/employee_registry.json"   # every camera recognises enrolled employees
  gate: null

match:
  # ROC-CALIBRATED on held-out renders of the live world (cross-camera pairs,
  # score = similarity x quality): docs/results_world_perception.md.
  sim_threshold: 0.7
  threshold_source: "ROC-CALIBRATED (scripts/calibrate_world_appearance.py, live 3D world)"
  margin_threshold: 0.10
  gate_extra_slack_m: 0.6   # foot-point noise (median 0.19 m, p90 0.33 m) at 3 claims/s
  # A verified/recognised employee's anchor absorbs the unnamed hypothesis the
  # same person had before it (starling_crdt.resolver._adopt_unanchored).
  anchor_adopt_radius_m: 2.0
  anchor_adopt_max_age_s: 10.0
  # Two cameras naming one person at the same instant differ by their combined
  # position error: not a conflict (starling_crdt.resolver).
  anchor_continue_slack_m: 2.0
  lost_threshold_s: 120.0
  ema_alpha: 0.10

net:
  listen_port: 5558
  neighbours: ["127.0.0.1:5556", "127.0.0.1:5557"]  # ring topology (CLAUDE.md rule 4)
  gossip_interval_s: 2.0

geometry:
  navmesh_path: "data/floorplan/warehouse_world.geojson"
  cell_size_m: 0.25

coverage:
  # This camera's own zone (largest piece), as computed from what it can see.
  roi_polygon: [[15.012, 14.012], [15.012, 17.738], [16.012, 17.738], [16.012, 17.988], [18.012, 17.988], [18.012, 18.238], [18.512, 18.238], [18.512, 19.512], [15.988, 19.512], [15.988, 19.262], [15.512, 19.262], [15.512, 19.512], [15.012, 19.512], [15.012, 19.988], [24.238, 19.988], [24.238, 19.738], [24.488, 19.738], [24.488, 19.488], [24.738, 19.488], [24.738, 19.238], [24.988, 19.238], [24.988, 18.488], [25.238, 18.488], [25.238, 17.738], [25.488, 17.738], [25.488, 17.238], [25.738, 17.238], [25.738, 16.988], [25.988, 16.988], [25.988, 16.488], [26.238, 16.488], [26.238, 16.238], [26.488, 16.238], [26.488, 15.988], [26.988, 15.988], [26.988, 15.738], [27.238, 15.738], [27.238, 15.488], [27.738, 15.488], [27.738, 15.238], [28.488, 15.238], [28.488, 14.988], [29.238, 14.988], [29.238, 14.738], [29.488, 14.738], [29.488, 14.488], [29.738, 14.488], [29.738, 14.238], [29.988, 14.238], [29.988, 10.012], [20.512, 10.012], [20.512, 10.512], [17.262, 10.512], [17.262, 10.738], [17.512, 10.738], [17.512, 10.988], [18.012, 10.988], [18.012, 11.238], [18.262, 11.238], [18.262, 11.488], [18.762, 11.488], [18.762, 11.738], [19.012, 11.738], [19.012, 11.988], [19.262, 11.988], [19.262, 12.238], [19.762, 12.238], [19.762, 12.488], [20.012, 12.488], [20.012, 12.738], [20.262, 12.738], [20.262, 12.988], [20.512, 12.988], [20.512, 14.012]]
  watched_boundary_ids: []
  tau_attest: 0.7
  background_alpha: 0.02
  bg_diff_threshold: 30.0
  blob_area_threshold: 120   # pixels in the quarter-resolution coverage frame

attest:
  tick_interval_s: 2.0
  tau_attest: 0.7

plausibility:
