# Hard partition: nodes {0,1} (west wing) are cut off from {2,3} (east
# wing) at t=120s, healed at t=300s. This is the scenario the C1 CRDT
# demonstration is built around: both sides keep operating independently
# during the cut, then reconverge to identical replicas after heal.
name: east_wing_drop
duration_s: 600
stream_epoch: 1750000000.0
speed: 1.0
nodes: [0, 1, 2, 3]
videos:
  0: data/videos/cam0.mp4
  1: data/videos/cam1.mp4
  2: data/videos/cam2.mp4
  3: data/videos/cam3.mp4
events:
  - {t: 120, action: partition, groups: [[0, 1], [2, 3]]}
  - {t: 300, action: heal}
