# The headline three-way experiment's ARM 3 configuration (WP-14 Part 4 /
# spec S10): partition at t=120, healed at t=300, plus node-02 running
# `fabricate` at intensity 0.4 from t=180 -- while it is cut off from
# nodes 0/1, so its fabricated claims only reach node-03 until the heal.
#
# Arm 1 (centralized baseline, apps/baseline.py) and arm 2 (Starling,
# healthy) run the SAME input videos and ground truth as this scenario,
# via scripts/run_headline.py -- arm 2 reuses scenarios/healthy.yaml
# (identical nodes/videos, no events) rather than duplicating it here.
#
# Partition + lie events require real container network namespaces
# (deploy/netem/apply.py) -- this scenario can only be exercised for real
# via `docker compose` (starling_eval.runner.run_docker_once), the same
# limitation east_wing_drop.yaml already documents for --local mode.
name: headline
duration_s: 600
stream_epoch: 1750000000.0
speed: 1.0
nodes: [0, 1, 2, 3]
videos:
  0: data/videos/cam0.mp4
  1: data/videos/cam1.mp4
  2: data/videos/cam2.mp4
  3: data/videos/cam3.mp4
events:
  - {t: 120, action: partition, groups: [[0, 1], [2, 3]]}
  - {t: 180, action: lie, node: 2, attack: fabricate, intensity: 0.4}
  - {t: 300, action: heal}
